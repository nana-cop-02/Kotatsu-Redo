name: Build Release APK

# Manually trigger release APK builds
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-build:
    runs-on: ubuntu-24.04
    outputs:
      BUILD_TAG: ${{ steps.prepare.outputs.BUILD_TAG }}
      BUILD_TIME: ${{ steps.prepare.outputs.BUILD_TIME }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Prepare build info
        id: prepare
        run: |
          BUILD_TAG="$(date +%Y%m%d_%H%M%S)"
          echo "BUILD_TAG=$BUILD_TAG" >> $GITHUB_OUTPUT
          echo "BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
          echo "Build tag: $BUILD_TAG"

  build-app:
    runs-on: ubuntu-24.04
    needs: prepare-build
    steps:
      - name: Clone Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Build release APK
        run: ./gradlew app:assembleRelease

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-apks
          path: "app/build/outputs/apk/release/*.apk"
          retention-days: 30

  sign-and-release:
    runs-on: ubuntu-24.04
    needs:
      - prepare-build
      - build-app
    if: ${{ secrets.SIGNING_KEY != '' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-apks
          path: apks

      - name: Sign APKs
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: apks
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Prepare signed APKs
        run: |
          mkdir -p signed_apks
          for apk in apks/*-signed.apk; do
            if [ -f "$apk" ]; then
              name=$(basename "$apk" -signed.apk)
              cp "$apk" "signed_apks/Kotatsu-${{ needs.prepare-build.outputs.BUILD_TAG }}-${name##*-}.apk"
            fi
          done

      - name: Create release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          tag_name: test-${{ needs.prepare-build.outputs.BUILD_TAG }}
          name: Kotatsu Test Build ${{ needs.prepare-build.outputs.BUILD_TAG }}
          body: |
            **Build Time**: ${{ needs.prepare-build.outputs.BUILD_TIME }}
            
            This is an automated test build from the `devel` branch.
            
            ### APK Variants
            - `universal` - Works on all devices
            - `arm64-v8a` - 64-bit ARM (most common)
            - `armeabi-v7a` - 32-bit ARM
            - `x86` - Intel 32-bit
            - `x86_64` - Intel 64-bit
            
            **Recommended**: Download the `universal` or `arm64-v8a` variant.
          files: signed_apks/*
          draft: false
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
